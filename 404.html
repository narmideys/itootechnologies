<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | ITOO Technologies</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .nf {
        min-height: 70vh;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 48px 24px;
        gap: 12px;
      }
      .nf h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      .nf p {
        margin: 0 0 18px;
        color: rgba(40, 32, 52, 0.72);
      }
      .nf a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        background: var(--color-primary, #962a8b);
        color: #fff !important;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <h1>Page not found</h1>
      <p>The page you’re looking for doesn’t exist or has moved.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
